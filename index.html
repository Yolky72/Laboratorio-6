<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio 6</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f4f6f8;
        }

        header {
            background-color: #2c3e50;
            padding: 1rem 2rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 1.5rem;
            justify-content: center;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: #3498db;
        }

        main {
            max-width: 800px;
            margin: 3rem auto;
            padding: 2rem;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        h1 {
            font-size: 2.8rem;
            color: #2c3e50;
            margin-bottom: 1.5rem;
        }

        .image-container {
            margin-top: 1.5rem;
        }

        .image-container img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <ul>
                <li><a href="#">pagina 1</a></li>
                <li><a href="#">pagina 2</a></li>
                <li><a href="#">pagina 3</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>BIENVENIDO</h1>
        <div class="image-container">
            <img src="Montaña.jpg" alt="Imagen de muestra">
        </div>
    </main>

</body>
</html>
